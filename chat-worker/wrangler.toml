name = "asteria-chat"
main = "index.js"
compatibility_date = "2026-11-10"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[[ratelimits]]
name = "CONNECT_LIMIT"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "AUTH_LIMIT"
namespace_id = "1004"
simple = { limit = 5, period = 60 }
